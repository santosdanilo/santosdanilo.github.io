  <div class="idea-board"><span>{{ t.scene_idea }}</span><div class="idea-sketch"><i></i><i></i><i></i></div><div class="task-tokens"><i></i><i></i><i></i></div></div>

  <span class="scene-spark spark-one">+</span><span class="scene-spark spark-two">+</span><span class="scene-spark spark-three">✦</span>
