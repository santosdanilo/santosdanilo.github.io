<section class="container section direction-section" id="about" aria-labelledby="direction-title">
  <div class="section-heading">
    <p class="eyebrow">{{ t.direction.label }}</p>
    <h2 id="direction-title">{{ t.direction.title }}</h2>
    <p>{{ t.direction.intro }}</p>
  </div>
  <div class="direction-grid">
    {% for item in t.direction.items %}
      <article>
        <p class="eyebrow">{{ item.label }}</p>
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
        {% if item.video %}
          <figure class="direction-video">
            <div class="direction-video-frame">
              <video controls preload="none" playsinline poster="{{ item.video.poster | relative_url }}">
                <source src="{{ item.video.src | relative_url }}" type="video/mp4">
              </video>
            </div>
            {% if item.video.caption %}<figcaption>{{ item.video.caption }}</figcaption>{% endif %}
          </figure>
        {% endif %}
      </article>
    {% endfor %}
  </div>
  <p class="direction-closing">{{ t.direction.closing }}</p>
</section>
