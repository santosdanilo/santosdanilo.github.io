<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#282a36" />
  <title>{% if page.error %}{{ t.not_found }} · {% endif %}{{ t.title }}</title>
  <meta name="description" content="{{ t.description | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  {% unless page.error %}
  <link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}" />
  <link rel="alternate" hreflang="pt-BR" href="{{ '/pt/' | absolute_url }}" />
  <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}" />
  {% endunless %} {% if page.error %}
  <meta name="robots" content="noindex" />
  {% endif %}
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ t.title | escape }}" />
  <meta property="og:description" content="{{ t.description | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta
    property="og:locale"
    content="{% if key == 'pt' %}pt_BR{% else %}en_US{% endif %}"
  />
  <meta
    property="og:image"
    content="{{ '/assets/images/social-card.png' | absolute_url }}"
  />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{ t.title | escape }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="{{ '/assets/images/favicon.svg' | relative_url }}"
  />
  <link
    rel="stylesheet"
    href="{{ '/assets/css/site.min.css' | relative_url }}"
  />
  <script
    src="{{ '/assets/js/portfolio.min.js' | relative_url }}"
    defer
  ></script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Danilo Santos",
      "jobTitle": "Full-Stack Engineer",
      "url": {{ '/' | absolute_url | jsonify }},
      "image": {{ '/assets/images/danilo.webp' | absolute_url | jsonify }},
      "sameAs": [{{ p.github | jsonify }}, {{ p.linkedin | jsonify }}],
      "alumniOf": {"@type": "CollegeOrUniversity", "name": "Universidade de Brasília"}
    }
  </script>
</head>
