<section class="container hero" id="top" aria-labelledby="hero-title">
  <div class="hero-copy">
    <p class="eyebrow">{{ t.hero.eyebrow }}</p>
    <h1 id="hero-title">{{ t.hero.start }} <span>{{ t.hero.accent }}</span></h1>
    <p class="hero-intro">{{ t.hero.intro }}</p>
    <p class="hero-detail">{{ t.hero.detail }}</p>
    <div class="hero-actions">
      <a class="button button-primary" href="#work">{{ t.hero.primary_action }} <span aria-hidden="true">↗</span></a>
      <a class="text-link" href="#contact">{{ t.hero.contact_action }} <span aria-hidden="true">→</span></a>
    </div>
    <a class="hero-direction text-link" href="#about">{{ t.hero.direction }} <span aria-hidden="true">↓</span></a>
    <div class="social-links">
      <a href="{{ p.github }}">GitHub <span aria-hidden="true">↗</span></a>
      <span aria-hidden="true">/</span>
      <a href="{{ p.linkedin }}">LinkedIn <span aria-hidden="true">↗</span></a>
    </div>
  </div>
  <figure class="portrait" data-tilt>
    <div class="portrait-stage">
      <div class="portrait-network" aria-hidden="true"></div>
      <img src="{{ '/assets/images/danilo-cutout.webp' | relative_url }}" width="640" height="640" alt="{{ t.hero.portrait_alt }}" fetchpriority="high">
    </div>
    <figcaption>{{ t.hero.portrait_caption }}</figcaption>
  </figure>
</section>
