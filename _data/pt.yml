work:
  label: "01 / RESULTADOS SELECIONADOS"
  title: O trabalho por trás dos números.
  intro: Três exemplos de como trato velocidade, confiabilidade e entrega de produto — e das decisões pelas quais assumi responsabilidade.
  contribution_label: O QUE FIZ
  outcome_label: O RESULTADO
  visual_label: VISÃO DA ENGENHARIA
  items:
    - id: performance
      company: GasHub
      category: PERFORMANCE FULL STACK E ARQUITETURA
      title: Um produto mais rápido, da interface ao banco.
      problem: Uma plataforma de comercialização de gás natural precisava de listagens mais rápidas e de uma arquitetura capaz de sustentar operações de negócio complexas conforme o produto crescia.
      contributions:
        - Analisei a performance da API de produtos, paralelizei consultas independentes e consolidei transações com políticas de acesso por linha.
        - Usei profiling do React e listas virtualizadas para reduzir o trabalho de renderização em cinco blocos de negociação com filtros independentes.
        - Introduzi Drizzle no Deno, validação com Zod, repositórios e transações com Unit of Work para separar regras de negócio do acesso a dados.
      outcome: A latência da API aquecida caiu 95,7%, para ~132 ms em 100 requisições. A montagem inicial no React passou de 59,1 ms para 1,8 ms. Operações de backend com múltiplas etapas ganharam transações atômicas.
      tags: [React, Deno, Drizzle ORM, PostgreSQL]
      diagram: performance
    - id: modernization
      company: MyTime
      category: MODERNIZAÇÃO DE SISTEMAS CRÍTICOS
      title: Pagamentos modernos. Operação contínua.
      problem: Um sistema de pagamentos em AngularJS e CoffeeScript precisava evoluir enquanto empresas continuavam dependendo dele todos os dias.
      contributions:
        - Planejei e implementei uma migração incremental para Angular, permitindo a coexistência de funcionalidades legadas e modernas.
        - Adicionei testes com Jest e Testing Library e reconstruí módulos centrais do POS com limites de estado bem definidos em NgRx.
        - Implementei fluxos acessíveis seguindo os padrões W3C, incluindo suporte a pessoas com deficiência visual.
      outcome: A migração de pagamentos foi concluída sem downtime. Os módulos reconstruídos do POS apoiaram um relançamento bem-sucedido e uma base mais fácil de manter e evoluir.
      tags: [Angular, TypeScript, NgRx, Acessibilidade]
      diagram: migration
    - id: validation
      company: GasHub
      category: VALIDAÇÃO DE PRODUTO E ENTREGAS COM IA
      title: Menos tempo para construir. Mais para aprender.
      problem: Uma equipe em estágio inicial precisava de um produto funcional de comercialização de gás natural para testar o modelo de negócio com usuários e stakeholders.
      contributions:
        - Desenvolvi os fluxos centrais entre compradores e vendedores e as notificações com React e Supabase, usando agentes de IA para acelerar a implementação.
        - Refinei requisitos com a equipe e usei artefatos de design compartilhados no Pencil.dev para conectar Produto e Engenharia.
        - Revisei e adaptei o código gerado aos padrões existentes e adicionei testes unitários e de ponta a ponta conforme o produto evoluiu.
      outcome: Protótipo funcional entregue em menos de três semanas para validação de mercado. Depois, trabalhos de formulários e reestruturação de design passaram de uma semana para três dias, incluindo revisão.
      tags: [React, Supabase, Agentes de IA, Playwright]
      diagram: market

approach:
  label: "02 / COMO TRABALHO"
  title: Assumir o problema. Fortalecer a equipe.
  intro: Minha contribuição vai além de implementar uma tela. Conecto os fluxos de negócio, as decisões técnicas e as pessoas que precisam manter o resultado.
  items:
    - title: Começar pelo fluxo de negócio
      text: Refinar requisitos, avaliar a viabilidade técnica e focar a primeira versão no que a equipe precisa aprender. No GasHub, isso significou validar o fluxo de negociação antes de expandir o produto.
    - title: Tornar a mudança administrável
      text: Usar migrações incrementais, contratos de API explícitos e limites claros de estado e transação. Preservar o que funciona e abrir espaço para o produto evoluir.
    - title: Medir, revisar e verificar
      text: Fazer profiling antes de otimizar. Usar testes automatizados relevantes e interfaces acessíveis. Código gerado por IA passa pela mesma revisão crítica de qualquer implementação.
    - title: Compartilhar o contexto
      text: Documentar regras de negócio e arquitetura, integrar novos engenheiros e criar referências comuns para Produto e Engenharia. Reduzir a dependência de uma única pessoa para manter as entregas.

