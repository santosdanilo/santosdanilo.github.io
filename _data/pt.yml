direction:
  label: "03 / MEU PRÓXIMO CAPÍTULO"
  title: Engenharia de produto, agora também com IA.
  intro: Meu próximo passo é desenvolver aplicações em que a IA faça parte da experiência do usuário. Levo para essa direção o mesmo foco em fluxos úteis, performance e facilidade de manutenção que orienta meu trabalho full stack.
  items:
    - label: PRÁTICA PROFISSIONAL
      title: Desenvolvimento com IA
      text: Já faz parte das minhas entregas no GasHub — de protótipos rápidos a fluxos de design para código, com revisão humana e testes automatizados.
    - label: EXPLORAÇÃO PRÁTICA
      title: Retrieval e RAG
      text: Desenvolvi um pipeline pessoal de RAG com Python, scikit-learn e NumPy. Uma base prática para explorar aplicações que combinam recuperação de informação e geração.
    - label: FORMAÇÃO CONTÍNUA
      title: Fundamentos de engenharia de IA
      text: Concluí os módulos de Fundamentos Gen AI, RAG e System Retrieval da Especialização em Engenharia de IA da Dev Eficiente.
  closing: Quero aplicar essa base a problemas reais de produto em uma posição full stack sênior, enquanto aprofundo minha experiência com aplicações que incorporam IA.

